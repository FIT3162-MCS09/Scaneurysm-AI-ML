name: Deploy SageMaker Endpoint

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS Region'
        required: true
        default: 'ap-southeast-1'
      bucket:
        description: 'S3 Bucket for Model Artifacts'
        required: true
      instance_type:
        description: 'SageMaker Instance Type'
        required: true
        default: 'ml.t2.medium'
      instance_count:
        description: 'Number of Instances'
        required: true
        default: '1'
      model_name:
        description: 'Model Name'
        required: true
        default: 'shap-resnet50'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}
      
      - name: Get AWS Account ID
        id: get-aws-account
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./model
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ github.event.inputs.region }}.amazonaws.com/tensorflow-inference:latest
          build-args: |
            REGION=${{ github.event.inputs.region }}
      
      - name: Deploy to SageMaker
        id: deploy
        run: |
          python deploy/deploy.py \
            --region ${{ github.event.inputs.region }} \
            --bucket ${{ github.event.inputs.bucket }} \
            --model-name ${{ github.event.inputs.model_name }} \
            --instance-type ${{ github.event.inputs.instance_type }} \
            --instance-count ${{ github.event.inputs.instance_count }} \
            --account ${{ secrets.AWS_ACCOUNT_ID }} \
            --role ${{ secrets.AWS_SAGEMAKER_ROLE_ARN }}
      
      - name: Save endpoint info
        uses: actions/upload-artifact@v2
        with:
          name: endpoint-info
          path: endpoint_info.json