name: Deploy SageMaker Endpoint

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS Region'
        required: true
        default: 'ap-southeast-1'
      bucket:
        description: 'S3 Bucket for Model Artifacts'
        required: true
      instance_type:
        description: 'SageMaker Instance Type'
        required: true
        default: 'ml.t2.medium'
      instance_count:
        description: 'Number of Instances'
        required: true
        default: '1'
      model_name:
        description: 'Model Name'
        required: true
        default: 'shap-resnet50'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.5.3
      
      - name: Set up Python
        uses: actions/setup-python@v4.7.1
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}
      
      - name: Set AWS Account ID
        run: echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
        
      # Create ECR repository if it doesn't exist
      - name: Create ECR Repository
        run: |
          aws ecr describe-repositories --repository-names tensorflow-inference || aws ecr create-repository --repository-name tensorflow-inference
        continue-on-error: true
      
      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      # Build and push using docker CLI after ECR login
      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ github.event.inputs.region }}.amazonaws.com/tensorflow-inference:latest ./model
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ github.event.inputs.region }}.amazonaws.com/tensorflow-inference:latest
      
      - name: Deploy to SageMaker
        id: deploy
        run: |
          python deploy/deploy.py \
            --region ${{ github.event.inputs.region }} \
            --bucket ${{ github.event.inputs.bucket }} \
            --model-name ${{ github.event.inputs.model_name }} \
            --instance-type ${{ github.event.inputs.instance_type }} \
            --instance-count ${{ github.event.inputs.instance_count }} \
            --account ${{ env.AWS_ACCOUNT_ID }} \
            --role ${{ secrets.AWS_SAGEMAKER_ROLE_ARN }}
      
      - name: Display endpoint info
        run: |
          cat endpoint_info.json
          echo "ENDPOINT_NAME=$(cat endpoint_info.json | jq -r '.endpoint_name')" >> $GITHUB_OUTPUT